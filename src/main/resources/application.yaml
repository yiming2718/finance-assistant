spring:
  application:
    name: finance-assistant
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    access-token-minutes: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info